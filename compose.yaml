name: dock-mita-frontend

services:
  web:
    build:
      context: .
      target: production
    image: dock-mita-frontend
    ports:
      - '${APP_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - path: .env
        required: false
    environment:
      NUXT_API_PROXY_TARGET: ${COMPOSE_API_PROXY_TARGET:-http://host.docker.internal:8080}
    restart: unless-stopped
