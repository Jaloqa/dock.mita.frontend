services:
  web:
    build:
      target: dev
    image: dock-mita-frontend-dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['sh', '-c', 'bun install --frozen-lockfile && npm run dev -- --host 0.0.0.0']
    restart: 'no'

volumes:
  node_modules:
