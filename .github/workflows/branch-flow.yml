name: Branch flow

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [prod, preprod, develop]

permissions:
  contents: read

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source → target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            prod)
              [[ "$HEAD" == "preprod" || "$HEAD" == hotfix/* ]] || { echo "::error::PRs into prod must come from preprod or hotfix/*"; exit 1; } ;;
            preprod)
              [[ "$HEAD" == "develop" || "$HEAD" == hotfix/* ]] || { echo "::error::PRs into preprod must come from develop or hotfix/*"; exit 1; } ;;
          esac
          echo "OK: $HEAD → $BASE"
